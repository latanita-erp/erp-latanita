<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Lista 100g - La Tanita</title>

    <style>
        @page {
            size: 216mm 330mm; /* Oficio / Legal */
            margin: 15mm;
        }
        body {
            font-family: Arial, sans-serif;
            color: #000;
            background: #fff;
            margin: 0;
            padding: 0;
        }
        .header {
            text-align: center;
            border-bottom: 2px solid #000;
            margin-bottom: 20px;
            padding-bottom: 10px;
        }
        .header img {
            max-width: 100px;
        }
        .header h1 {
            margin: 5px 0 0 0;
            font-size: 24px;
        }
        .header h2 {
            margin: 0;
            font-size: 18px;
        }
        .date {
            text-align: right;
            font-size: 12px;
            margin-bottom: 10px;
        }
        .type-group {
            margin-bottom: 20px;
            page-break-inside: avoid;
        }
        .type-title {
            background-color: #e5e7eb;
            font-weight: bold;
            padding: 5px 10px;
            font-size: 14px;
            border: 1px solid #9ca3af;
            border-bottom: none;
            margin-bottom: 0;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #9ca3af;
            padding: 4px 6px;
            text-align: right;
            font-size: 12px;
        }
        th {
            background-color: #f3f4f6;
            font-weight: bold;
        }
        td.name-col, th.name-col {
            text-align: left;
            width: 60%;
        }
    </style>
</head>

<body>
    <div class="header">
        <img src="logo.jpg" alt="La Tanita" onerror="this.style.display='none'">
        <h1>Panadería y Fiambrería La Tanita</h1>
        <h2>Lista de Precios por 100 g</h2>
    </div>

    <div class="date" id="print-date"></div>
    <div id="content">Cargando precios...</div>

    <script>
        function formatMoney(val) {
            return val.toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        async function loadPrices() {
            document.getElementById('print-date').innerText =
                "Actualizado: " + new Date().toLocaleDateString('es-AR') + " " +
                new Date().toLocaleTimeString('es-AR', {hour: '2-digit', minute:'2-digit'});

            try {
                const res = await fetch('/api/products');
                const products = await res.json();

                // Filtrar solo fiambres y quesos
                const filtered = products.filter(p =>
                    p.type?.toLowerCase() === 'fiambres' ||
                    p.type?.toLowerCase() === 'quesos'
                );

                // Agrupar por tipo
                const grouped = {};
                filtered.forEach(p => {
                    const type = p.type || 'Otros';
                    if (!grouped[type]) grouped[type] = [];
                    grouped[type].push(p);
                });

                const types = Object.keys(grouped).sort();

                let html = '';
                types.forEach(type => {
                    html += `<div class="type-group">`;
                    html += `<div class="type-title">${type.toUpperCase()}</div>`;
                    html += `<table>
                                <thead>
                                    <tr>
                                        <th class="name-col">Descripción</th>
                                        <th>100 g</th>
                                    </tr>
                                </thead>
                                <tbody>`;

                    grouped[type]
                        .sort((a, b) => a.name.localeCompare(b.name))
                        .forEach(p => {
                            html += `
                                <tr>
                                    <td class="name-col"><strong>${p.name}</strong></td>
                                    <td>$${formatMoney(p.price_100g)}</td>
                                </tr>
                            `;
                        });

                    html += `</tbody></table></div>`;
                });

                document.getElementById('content').innerHTML = html;

                setTimeout(() => window.print(), 500);

            } catch (err) {
                document.getElementById('content').innerHTML = "Error al cargar la lista.";
            }
        }

        window.onload = loadPrices;
    </script>
</body>
</html>
