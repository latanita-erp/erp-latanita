<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imprimir Promoción</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: #fff;
        }

        /* Contenedor principal ajustado al tamaño de la imagen/hoja A4 */
        .print-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            /* La imagen de fondo debe llamarse bg_promocion.jpg y estar en la misma carpeta static/ */
            background-image: url('bg_promocion.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            aspect-ratio: 1 / 1.414; /* Proporción A4 */
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        /* El número de la promoción sobre el círculo de la letra O */
        /* Ajustar estos valores según la posición real en la imagen */
        .promo-number {
            position: absolute;
            top: 32%; /* Ajustar top/left según imagen. 32% parece estar a la altura del título PROMOCIÓN */
            left: 71%;
            transform: translate(-50%, -50%);
            font-size: 3rem;
            font-weight: bold;
            color: #000;
        }

        /* Contenedor del contenido (lista de productos y total) */
        .promo-content {
            position: absolute;
            top: 45%;
            left: 15%;
            right: 15%;
            bottom: 15%;
            display: flex;
            flex-direction: column;
            text-align: center;
            color: #000;
        }

        .promo-title {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            text-transform: uppercase;
        }

        .promo-products {
            list-style: none;
            padding: 0;
            margin: 0 0 2rem 0;
            font-size: 1.5rem;
            line-height: 1.8;
            flex-grow: 1;
        }

        .promo-products li {
            border-bottom: 2px dashed rgba(0,0,0,0.2);
            margin-bottom: 0.5rem;
            padding-bottom: 0.5rem;
        }

        .promo-total {
            font-size: 3rem;
            font-weight: 900;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 15px;
            padding: 1rem;
            display: inline-block;
            align-self: center;
            border: 3px solid #d32f2f;
            color: #d32f2f;
        }

        @media print {
            body { background: none; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .print-container {
                box-shadow: none;
                width: 100%;
                max-width: 100%;
                height: 100vh;
                margin: 0;
                page-break-after: avoid;
            }
        }
    </style>
</head>
<body>

    <div class="print-container">
        <!-- El número de promoción se inyectará aquí -->
        <div class="promo-number" id="promo-number">1</div>

        <div class="promo-content">
            <div class="promo-title" id="promo-title">Cargando...</div>
            <ul class="promo-products" id="promo-products">
                <!-- Productos inyectados por JS -->
            </ul>
            <div class="promo-total" id="promo-total">$0.00</div>
        </div>
    </div>

    <script>
        function formatMoney(val) {
            return parseFloat(val).toLocaleString('es-AR', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });
        }

        async function loadPromotion() {
            const urlParams = new URLSearchParams(window.location.search);
            const promoId = parseInt(urlParams.get('id'));
            
            if (!promoId) {
                document.getElementById('promo-title').innerText = "Promoción no encontrada";
                return;
            }

            try {
                const res = await fetch('/api/promotions');
                const data = await res.json();
                
                const promo = data.find(p => p.id === promoId);
                
                if (!promo) {
                    document.getElementById('promo-title').innerText = "Promoción no encontrada";
                    return;
                }

                // Número de promoción
                document.getElementById('promo-number').innerText = promo.id;
                document.getElementById('promo-title').innerText = promo.name;

                // Renderizar productos
                const ul = document.getElementById('promo-products');
                ul.innerHTML = '';
                
                let totalBaseCost = 0;
                promo.products.forEach(p => {
                    totalBaseCost += parseFloat(p.cost || 0);
                    const li = document.createElement('li');
                    li.innerText = p.product_name;
                    ul.appendChild(li);
                });

                // Calcular total final con descuento
                const discount = parseFloat(promo.discount_percentage || 0);
                const totalDiscounted = totalBaseCost * (1 - (discount / 100));

                document.getElementById('promo-total').innerText = `$ ${formatMoney(totalDiscounted)}`;

                // Disparar impresión automática
                setTimeout(() => {
                    window.print();
                }, 1000);

            } catch (e) {
                console.error(e);
                document.getElementById('promo-title').innerText = "Error cargando promoción";
            }
        }

        window.onload = loadPromotion;
    </script>
</body>
</html>
